<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline | InfoHQ — AI & Software Systems Studio</title>
  <meta name="description" content="You are currently offline. Check your internet connection to reconnect with InfoHQ." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/webp" href="/favicon.webp" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#7C5CE8" />
  <style>
    :root {
      --color-primary: #5B4CF5;
      --color-primary-end: #E85AA0;
      --color-bg: #090514;
      --color-card-bg: rgba(255, 255, 255, 0.04);
      --color-card-border: rgba(120, 110, 220, 0.16);
      --color-text: #FFFFFF;
      --color-text-muted: #9D96B8;
      --color-warning: #F59E0B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background glow */
    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(280px, 60vw, 560px);
      height: clamp(280px, 60vw, 560px);
      background: radial-gradient(circle, rgba(91, 76, 245, 0.18) 0%, rgba(232, 90, 160, 0.1) 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(60px);
    }

    .offline-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: rgba(18, 12, 38, 0.72);
      border: 1px solid var(--color-card-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: clamp(2rem, 5vw, 2.75rem) clamp(1.5rem, 4vw, 2.25rem);
      box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    /* Brand Logo */
    .brand-wrap {
      margin-bottom: 1.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo {
      height: 32px;
      width: auto;
      object-fit: contain;
    }

    /* Pulse Radar Icon */
    .pulse-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(245, 158, 11, 0.35);
      animation: pulse-ring 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .pulse-ring:nth-child(2) {
      animation-delay: 0.6s;
    }

    .pulse-core {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-warning);
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.7);
        opacity: 0.8;
      }
      80%, 100% {
        transform: scale(1.45);
        opacity: 0;
      }
    }

    /* Status Pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.28);
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #FBBF24;
      margin-bottom: 1rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #F59E0B;
      box-shadow: 0 0 8px #F59E0B;
      animation: blink 1.6s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.65rem;
      line-height: 1.2;
    }

    .text-gradient {
      background: linear-gradient(135deg, #A78BFA 0%, #F472B6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.desc {
      font-size: 0.94rem;
      color: var(--color-text-muted);
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }

    /* Action Buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem 1.5rem;
      background: linear-gradient(90deg, var(--color-primary) 0%, var(--color-primary-end) 100%);
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(91, 76, 245, 0.4);
      transition: transform 0.2s ease, filter 0.2s ease;
      text-decoration: none;
    }

    .btn-retry:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .btn-retry:active {
      transform: scale(0.98);
    }

    /* Offline Direct Contact */
    .offline-support {
      padding-top: 1.25rem;
      border-top: 1px solid rgba(120, 110, 220, 0.14);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .support-title {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-muted);
    }

    .support-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    .support-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.9rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #E2E8F0;
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .support-pill:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(167, 139, 250, 0.5);
      color: #FFFFFF;
    }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.74rem;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <main class="offline-container">
    <div class="brand-wrap">
      <img 
        src="/images/infohq-brandlogo.webp" 
        alt="InfoHQ Logo" 
        width="130" 
        height="65" 
        class="brand-logo"
      />
    </div>

    <div class="pulse-wrapper" aria-hidden="true">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-core">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
    </div>

    <div class="status-pill">
      <span class="status-dot" aria-hidden="true"></span>
      <span>No Connection</span>
    </div>

    <h1>You are <span class="text-gradient">offline</span></h1>
    <p class="desc">
      Your device is currently disconnected from the internet. As soon as your connection is back, InfoHQ will automatically reconnect.
    </p>

    <div class="btn-group">
      <button type="button" class="btn-retry" id="retry-btn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        <span>Check Connection</span>
      </button>
    </div>

    <div class="offline-support">
      <span class="support-title">Direct Studio Contact</span>
      <div class="support-links">
        <a href="tel:+919118991196" class="support-pill" aria-label="Call InfoHQ">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          <span>Call Us</span>
        </a>
        <a href="mailto:contact@infohq.in" class="support-pill" aria-label="Email InfoHQ">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <span>Email Us</span>
        </a>
      </div>
    </div>

    <p class="footer-note">InfoHQ &bull; Pune &bull; Prayagraj &bull; Pan-India</p>
  </main>

  <script>
    const retryBtn = document.getElementById('retry-btn');
    
    function attemptReload() {
      if (retryBtn) {
        retryBtn.innerHTML = '<span>Reconnecting...</span>';
        retryBtn.style.opacity = '0.75';
      }
      setTimeout(() => {
        window.location.reload();
      }, 400);
    }

    retryBtn?.addEventListener('click', attemptReload);

    // Auto-reload the moment internet returns
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
